<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/gallery/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Dermatologiya Farg'ona | Radeski Skin Clinic — kosmetologiya, IPL, lazer</title>

    <!-- Meta SEO Tags (static defaults for crawlers before JS; JS updates per locale URL) -->
    <meta name="description" content="Radeski — Farg'onadagi dermatologiya va kosmetologiya klinikasi. IPL, lazer epilyatsiya, dermatoskopiya, fototerapiya, botoks va Mohs. Manzil: O'zbekiston Ovozi ko'chasi, 1A. Tel: +998 73 200-73-73." />
    <meta name="keywords" content="dermatologiya Farg'ona, dermatolog Farg'ona, kosmetologiya Farg'ona, Radeski, IPL, lazer epilyatsiya, dermatoskopiya, fototerapiya, botoks, psoriaz, vitiligo, Qo'qon" />
    <meta name="author" content="Radeski Skin & Aesthetic Clinic" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <!-- Canonical + hreflang are set per URL (early script + React) to avoid duplicate-home signals on inner pages -->

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://radeski.uz/uz" />
    <meta property="og:title" content="Dermatologiya Farg'ona | Radeski Skin Clinic" />
    <meta property="og:description" content="Farg'onadagi dermatologiya, kosmetologiya va dermato-onkologiya klinikasi. IPL, lazer, fototerapiya va malakali shifokorlar." />
    <meta property="og:image" content="https://radeski.uz/gallery/logo.webp" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dermatologiya Farg'ona | Radeski Skin Clinic" />
    <meta name="twitter:description" content="Dermatologiya va kosmetologiya Farg'ona shahrida — Radeski Skin Clinic." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function () {
        var origin = 'https://radeski.uz';
        var path = location.pathname.replace(/\/+$/, '') || '/uz';
        if (path === '/') path = '/uz';
        var segments = path.split('/').filter(Boolean);
        var isArticleAlias =
          segments.length >= 3 &&
          segments[1] === 'articles' &&
          segments[2] &&
          segments[2].indexOf('art-') !== 0;
        if (isArticleAlias) return;
        var href = origin + path;
        var link = document.querySelector('link[rel="canonical"]');
        if (!link) {
          link = document.createElement('link');
          link.rel = 'canonical';
          document.head.appendChild(link);
        }
        link.href = href;
        var og = document.querySelector('meta[property="og:url"]');
        if (og) og.setAttribute('content', href);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
